<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ViralForge PRO</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:18px;max-width:480px;margin:auto}h1{text-align:center;background:linear-gradient(90deg,#ff0055,#ff8a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}input,select{width:100%;padding:16px;border-radius:14px;border:0;background:#1e1e1e;color:#fff;margin:8px 0;font-size:16px;box-sizing:border-box}button{width:100%;padding:18px;border-radius:14px;border:0;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;font-weight:900;font-size:18px} .card{background:#1a1a1a;border-radius:16px;padding:16px;margin:12px 0;border-left:4px solid #ff0055} .time{color:#ff8a00;font-weight:800;font-size:13px;display:block;margin-bottom:6px} #paywall{display:none;position:fixed;inset:0;background:#000f;padding:20px;z-index:99;text-align:center} #paywall div{background:#1a1a1a;padding:30px;border-radius:20px;max-width:380px;margin:60px auto} #paywall a{display:block;background:#00c853;color:#fff;padding:18px;border-radius:14px;text-decoration:none;font-weight:900;margin-top:20px} #result{display:none} .free{color:#00e676;text-align:center;font-size:13px;margin:8px}</style></head><body><h1>🔥 ViralForge AI</h1><p class="free" id="freeInfo"></p><input id="topic" placeholder="Football, Makeup, Business..."><select id="style"><option>Style Choc ⚡</option><option>Style Éducatif 🧠</option><option>Style Storytelling 📖</option></select><button id="btn" onclick="generate()">GÉNÉRER LE SCRIPT 🚀</button><div id="result"></div><button id="copyBtn" style="display:none;background:#fff;color:#000;margin-top:12px" onclick="copyIt()">📋 COPIER</button><div id="paywall"><div><h2>🚫 Limite gratuite atteinte</h2><p>2 essais utilisés. Débloque illimité!</p><a href="https://pay.fondeka.com/p/8VFF74Z22" target="_blank">💳 DÉBLOQUER - PAYER MAINTENANT</a><p style="font-size:12px;color:#888;margin-top:15px">Après paiement, WhatsApp pour code VIP</p><button style="background:#333;margin-top:10px" onclick="document.getElementById('paywall').style.display='none'">Fermer</button><div style="margin-top:20px"><input id="vip" placeholder="Code VIP" style="text-align:center"><button onclick="checkVip()" style="background:#fff;color:#000;margin-top:8px">ACTIVER VIP</button></div></div></div><script>const BACKEND="https://viralforge-ai-backend-html.onrender.com";const MAX_FREE=2;let last="";const getCount=()=>parseInt(localStorage.getItem('vf_count')||'0');const setCount=n=>{localStorage.setItem('vf_count',n);updateFree()};function updateFree(){let r=MAX_FREE-getCount();document.getElementById('freeInfo').innerText=r>0?`Essai gratuit: ${r} restante`:`Essai épuisé - VIP requis`}updateFree();async function generate(){if(getCount()>=MAX_FREE&&localStorage.getItem('vf_vip')!=='VIP2026'){document.getElementById('paywall').style.display='block';return}const topic=document.getElementById('topic').value.trim();if(!topic)return alert("Sujet?");const btn=document.getElementById('btn'),res=document.getElementById('result');btn.innerText="⏳ GÉNÉRATION...";btn.disabled=true;res.style.display="block";res.innerHTML="⏰ IA en cours...";try{const r=await fetch(`${BACKEND}/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,style:document.getElementById('style').value})});const data=await r.json();if(data.error)throw new Error(data.error);last=data.script||data.full;res.innerHTML=`<div class="card"><span class="time">⏱️ 0-5s - HOOK CHOC</span>${data.hook||''}</div><div class="card" style="border-color:#ff8a00"><span class="time">⏱️ 5-12s - SECRET 1</span>${data.part1||''}</div><div class="card" style="border-color:#ffcc00"><span class="time">⏱️ 12-20s - SECRET 2</span>${data.part2||''}</div><div class="card" style="border-color:#00e676"><span class="time">⏱️ 20-30s - SECRET 3 + CTA</span>${data.part3||''}</div>`;document.getElementById('copyBtn').style.display="block";if(localStorage.getItem('vf_vip')!=='VIP2026')setCount(getCount()+1);if(getCount()>=MAX_FREE&&localStorage.getItem('vf_vip')!=='VIP2026')setTimeout(()=>document.getElementById('paywall').style.display='block',1200)}catch(e){res.innerText="Erreur: "+e.message}btn.innerText="GÉNÉRER LE SCRIPT 🚀";btn.disabled=false}function copyIt(){navigator.clipboard.writeText(last);alert("Copié! 📋")}function checkVip(){if(document.getElementById('vip').value==='VIP2026'){localStorage.setItem('vf_vip','VIP2026');alert('VIP Activé! 🔓');document.getElementById('paywall').style.display='none';updateFree()}else alert('Code invalide')}</script></body></html>
