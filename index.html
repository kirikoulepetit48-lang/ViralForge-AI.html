<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralForge AI - Générateur Viral</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:white;padding:20px;max-width:600px;margin:auto}
h1{text-align:center;color:#ff0055}
input,select,button{width:100%;padding:15px;margin:10px 0;border-radius:12px;border:none;font-size:16px}
input,select{background:#1a1a1a;color:white}
button{background:linear-gradient(45deg,#ff0055,#ff8a00);color:white;font-weight:bold;cursor:pointer}
#result{background:#1a1a1a;padding:15px;border-radius:12px;margin-top:20px;white-space:pre-wrap;display:none}
.loading{opacity:0.6}
</style>
</head>
<body>
<h1>🔥 ViralForge AI</h1>
<p style="text-align:center;opacity:0.7">Génère des scripts TikTok viraux en 5s</p>

<input id="topic" placeholder="Ton sujet : ex: business, football, amour...">
<select id="style">
<option value="choc">Style Choc ⚡</option>
<option value="story">Story Time 📖</option>
<option value="conseil">Conseil Value 💎</option>
<option value="humour">Humour 😂</option>
</select>

<button id="btn" onclick="generate()">GÉNÉRER LE SCRIPT 🚀</button>

<div id="result"></div>

<script>
const BACKEND_URL = "https://viralforge-ai-backend-html.onrender.com";

async function generate(){
  const topic = document.getElementById('topic').value;
  const style = document.getElementById('style').value;
  const btn = document.getElementById('btn');
  const resultDiv = document.getElementById('result');
  
  if(!topic){alert("Écris un sujet d'abord!");return;}
  
  btn.innerText = "Génération en cours... ⏳";
  btn.classList.add('loading');
  resultDiv.style.display = "block";
  resultDiv.innerText = "🤖 L'IA de ViralForge écrit ton script viral...";

  try{
    const res = await fetch(`${BACKEND_URL}/generate`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({topic, style})
    });
    
    const data = await res.json();
    
    if(data.script){
      resultDiv.innerText = data.script;
    } else {
      resultDiv.innerText = "Erreur: " + (data.error || "Réessaie");
    }
  } catch(e){
    resultDiv.innerText = "❌ Erreur de connexion au backend. Attends 30s et réessaie (Render se réveille).";
    console.log(e);
  }
  
  btn.innerText = "GÉNÉRER LE SCRIPT 🚀";
  btn.classList.remove('loading');
}
</script>
</body>
</html>
