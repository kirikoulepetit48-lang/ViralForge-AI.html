<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViralForge AI - VRAI</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#08080f;color:white;min-height:100vh}
    nav{display:flex;justify-content:space-between;align-items:center;padding:20px 7%;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(8,8,15,0.9);position:sticky;top:0;z-index:100;backdrop-filter:blur(15px)}
    .logo{font-size:24px;font-weight:bold}.logo span{color:#ff4d8d}
    nav button{background:linear-gradient(135deg,#ff4d8d,#8b5cff);color:white;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;cursor:pointer}
    .hero{text-align:center;padding:90px 20px 50px;max-width:1000px;margin:auto}
    .badge{display:inline-block;background:rgba(255,77,141,0.12);border:1px solid rgba(255,77,141,0.4);color:#ff6fa5;padding:10px 18px;border-radius:30px;margin-bottom:25px}
    .hero h1{font-size:55px;line-height:1.1;margin-bottom:20px}
    .gradient-text{background:linear-gradient(90deg,#ff4d8d,#8b5cff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hero p{color:#aaa;font-size:18px;max-width:700px;margin:auto;line-height:1.7}
    .generator-section{padding:30px 20px 80px}
    .generator{max-width:900px;margin:auto;background:#11111c;border:1px solid rgba(255,255,255,0.08);padding:30px;border-radius:25px;box-shadow:0 0 50px rgba(139,92,255,0.1)}
    label{display:block;margin:10px 0;font-weight:bold}
    textarea,select{width:100%;background:#181825;color:white;border:1px solid #2b2b3d;padding:16px;border-radius:12px;font-size:16px;outline:none;margin-bottom:20px}
    textarea{height:130px;resize:none}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .generate-btn{width:100%;padding:18px;border:none;border-radius:14px;cursor:pointer;font-size:17px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff4d8d,#8b5cff);transition:0.3s}
    .generate-btn:disabled{opacity:0.6;cursor:not-allowed}
    .loading{display:none;text-align:center;padding:30px;color:#aaa}
    .spinner{width:40px;height:40px;border:4px solid #333;border-top:4px solid #ff4d8d;border-radius:50%;margin:0 auto 15px;animation:spin 1s linear infinite}
    @keyframes spin{100%{transform:rotate(360deg)}}
    .results{display:none;max-width:900px;margin:30px auto}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .card{background:#11111c;border:1px solid rgba(255,255,255,0.08);padding:22px;border-radius:18px}
    .card h3{margin-bottom:15px;color:#ff6fa5}
    .card p{color:#bbb;line-height:1.7;white-space:pre-line}
    .full-card{grid-column:1/-1}
    .copy-btn{margin-top:15px;background:#252536;border:none;color:white;padding:10px 15px;border-radius:8px;cursor:pointer}
    @media(max-width:700px){.hero h1{font-size:38px}.options,.result-grid{grid-template-columns:1fr}.full-card{grid-column:auto}}
  </style>
</head>
<body>
<nav><div class="logo">Viral<span>Forge</span> AI</div><button onclick="document.getElementById('generator').scrollIntoView({behavior:'smooth'})">Créer maintenant 🚀</button></nav>
<section class="hero">
  <div class="badge">🤖 IA GROQ Connectée - VRAI</div>
  <h1>Transforme tes idées en <span class="gradient-text">contenu viral</span></h1>
  <p>Plus de fake. Ton backend Groq génère vraiment le contenu.</p>
</section>
<section class="generator-section" id="generator">
  <div class="generator">
    <h2>✨ Crée ton contenu TikTok (VRAI)</h2>
    <label>Quel est ton sujet ?</label>
    <textarea id="topic" placeholder="Ex: Comment gagner de l'argent sur Internet..."></textarea>
    <div class="options">
      <div><label>Type</label><select id="contentType"><option>🎓 Éducatif</option><option>😂 Divertissement</option><option>💰 Business</option><option>🔥 Motivation</option></select></div>
      <div><label>Style</label><select id="style"><option>🔥 Viral et énergique</option><option>🎓 Professionnel</option><option>😂 Drôle</option></select></div>
    </div>
    <button class="generate-btn" id="genBtn" onclick="generateContent()">🚀 Générer mon contenu RÉEL</button>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><p id="loadingText">🤖 Groq est en train d'écrire...</p></div>
  <div class="results" id="results">
    <h2>🔥 Ton contenu RÉEL est prêt !</h2>
    <div class="result-grid">
      <div class="card"><h3>⚡ Hook viral</h3><p id="hook"></p><button class="copy-btn" onclick="copyText('hook')">Copier 📋</button></div>
      <div class="card"><h3>📢 CTA</h3><p id="cta"></p><button class="copy-btn" onclick="copyText('cta')">Copier 📋</button></div>
      <div class="card full-card"><h3>📝 Script TikTok</h3><p id="script"></p><button class="copy-btn" onclick="copyText('script')">Copier 📋</button></div>
      <div class="card"><h3>🎬 Scènes</h3><p id="scenes"></p></div>
      <div class="card"><h3>#️⃣ Hashtags</h3><p id="hashtags"></p></div>
    </div>
  </div>
</section>

<script>
const BACKEND_URL = "https://c-tik-tok-backend.onrender.com"; // CHANGE SI TON URL BACKEND EST DIFFERENTE

async function generateContent(){
  const topic = document.getElementById("topic").value.trim();
  const contentType = document.getElementById("contentType").value;
  const style = document.getElementById("style").value;
  const btn = document.getElementById("genBtn");
  const loading = document.getElementById("loading");
  const results = document.getElementById("results");
  const loadingText = document.getElementById("loadingText");

  if(!topic){ alert("⚠️ Écris un sujet"); return; }

  results.style.display="none";
  loading.style.display="block";
  btn.disabled=true;
  btn.innerHTML="⏳ Groq écrit...";
  loadingText.innerText="🤖 Connexion à Groq...";

  try{
    loadingText.innerText="🤖 Llama 3.3 70B réfléchit...";
    const res = await fetch(`${BACKEND_URL}/generate`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({topic, contentType, style})
    });
    
    const json = await res.json();
    console.log("Réponse backend:", json);

    if(!res.ok) throw new Error(json.message || json.error || "Backend erreur");

    // Le backend renvoie { success:true, data:{hook, script...} }
    const data = json.data || json.script || json;

    document.getElementById("hook").innerText = data.hook || "Pas de hook";
    document.getElementById("script").innerText = data.script || data.show || "";
    document.getElementById("scenes").innerText = data.scenes || data.show || "";
    document.getElementById("cta").innerText = data.cta || "";
    document.getElementById("hashtags").innerText = data.hashtags || "";

    loading.style.display="none";
    results.style.display="block";
    results.scrollIntoView({behavior:"smooth"});

  }catch(e){
    loading.style.display="none";
    alert("❌ ERREUR: " + e.message + "\n\n1. Vérifie que ton backend est en LIVE vert sur Render\n2. Vérifie que GROQ_API_KEY est dans Environment\n3. Vérifie que BACKEND_URL est bonne: " + BACKEND_URL);
    console.error(e);
  }finally{
    btn.disabled=false;
    btn.innerHTML="🚀 Générer mon contenu RÉEL";
  }
}

function copyText(id){
  navigator.clipboard.writeText(document.getElementById(id).innerText);
  alert("📋 Copié !");
}
</script>
</body>
</html>
